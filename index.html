<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Video on Website</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f2f2f2;
    }
    .video-container {
      max-width: 800px;
      margin: auto;
      background: #fff;
      padding: 10px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    video {
      width: 100%;
      height: auto;
      border-radius: 8px;
    }
  </style>
</head>
<body>


  <div class="video-container">
    <h2>My Website Video</h2>
    <video controls>
      <source src="your-video.mp4" type="video/mp4">
      Aapka browser is video format ko support nahi karta.
    </video>
  </div>


</body>
</html>
